name: Dependabot auto-merge

on: pull_request

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        id: metadata

      # Auto-merge só entra na fila depois que os checks obrigatórios
      # (branch protection: lint/test/build/e2e/analyze) passarem - major
      # bump fica de fora, sempre revisado manualmente.
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Merge feito com o GITHUB_TOKEN nao dispara os workflows de push
          # (CI, publish, deploy): o bump entra no master mas nao vai pro ar.
          # Com AUTO_MERGE_TOKEN (PAT, cadastrado como Dependabot secret) o
          # merge conta como de um usuario e dispara o pipeline. Sem o secret,
          # cai no comportamento anterior.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
