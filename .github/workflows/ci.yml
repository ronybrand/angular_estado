name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Imagem oficial já traz os browsers instalados - evita o
    # "npx playwright install --with-deps" (apt-get contra archive.ubuntu.com,
    # que já travou o job por 15min+ em mirrors instáveis). Versão precisa
    # bater com @playwright/test do package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      # O container roda como root, mas $HOME aponta pro workspace montado
      # pelo runner (dono pwuser) - Firefox recusa rodar assim (ver doc da
      # própria Playwright: precisa de $HOME que o usuário atual possua).
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
