name: Dependency review

# Blocks a pull request that adds or bumps a runtime dependency with a known HIGH or CRITICAL
# vulnerability. Dependabot alerts only fire once a dependency is already on the default
# branch; this fails the pull request before it gets there.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # The summary stays in the job log: a comment would need pull-requests: write.
          comment-summary-in-pr: never
