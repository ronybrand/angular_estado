<nav class="navbar navbar-dark app-navbar">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand" routerLink="">{{ title }}</a>
    <div class="d-flex align-items-center">
      <a class="btn btn-link text-white me-2" routerLink="perguntar-ia" data-testid="ask-ia-link">{{
        askIaLinkLabel
      }}</a>
      <button
        type="button"
        class="btn btn-sm btn-outline-light me-2"
        data-testid="global-lang-toggle"
        (click)="toggleLang()"
        [disabled]="!supportsEn"
      >
        {{ langService.lang() === 'pt' ? 'EN' : 'PT' }}
      </button>
      @if (authService.isAuthenticated()) {
        <button
          type="button"
          class="btn btn-link text-white"
          data-testid="logout-button"
          aria-label="Sair"
          title="Sair"
          (click)="logout()"
        >
          <app-icon name="box-arrow-right" />
        </button>
      }
    </div>
  </div>
</nav>
@if (globalError.mensagem(); as mensagem) {
  <div class="container mt-3">
    <div
      class="alert alert-danger d-flex justify-content-between align-items-center"
      role="alert"
      data-testid="global-error"
    >
      {{ mensagem }}
      <button
        type="button"
        class="btn-close"
        aria-label="Fechar"
        data-testid="global-error-close"
        (click)="globalError.limpar()"
      ></button>
    </div>
  </div>
}
<div class="mt-4">
  <router-outlet></router-outlet>
</div>
<app-footer></app-footer>
