<div class="container mt-3">
  <div class="row">
    <div class="col-md-5 mx-auto">
      <app-error-msg></app-error-msg>
      <div class="card">
        <div class="card-header">Login</div>
        <div class="card-body">
          <form #f="ngForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="username" class="col-sm-4 col-form-label form-label-eyebrow"
                >Usuário</label
              >
              <div class="col-sm-12">
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  name="username"
                  #username="ngModel"
                  [(ngModel)]="credenciais.username"
                  [class.is-invalid]="!username.valid && username.touched"
                  [attr.aria-invalid]="!username.valid && username.touched ? true : null"
                  aria-describedby="username-erro"
                  required
                />
                @if (!username.valid && username.touched) {
                  <div id="username-erro" class="text-danger">Digite o usuário.</div>
                }
              </div>
            </div>
            <div class="mb-3">
              <label for="password" class="col-sm-4 col-form-label form-label-eyebrow">Senha</label>
              <div class="col-sm-12">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  #password="ngModel"
                  [(ngModel)]="credenciais.password"
                  [class.is-invalid]="!password.valid && password.touched"
                  [attr.aria-invalid]="!password.valid && password.touched ? true : null"
                  aria-describedby="password-erro"
                  required
                />
                @if (!password.valid && password.touched) {
                  <div id="password-erro" class="text-danger">Digite a senha.</div>
                }
              </div>
            </div>
            <div class="col-sm-12">
              <button
                class="btn btn-primary float-end"
                type="submit"
                [disabled]="!f.valid || autenticando()"
              >
                Entrar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
