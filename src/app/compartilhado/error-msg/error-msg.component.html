@if (error()) {
  <div class="alert alert-danger" role="alert" aria-live="assertive">
    {{ error() }}
    @if (apiIndisponivel()) {
      <a class="d-block mt-2" [href]="urlLigarApi" target="_blank" rel="noopener noreferrer"
        >Ligar a API (Turn on the API)</a
      >
    }
    @if (requestId()) {
      <small class="d-block text-muted">ID de referência: {{ requestId() }}</small>
    }
  </div>
}
