<dialog #dialog class="confirm-dialog" [attr.aria-label]="mensagem()" (cancel)="cancelar.emit()">
  <p>{{ mensagem() }}</p>
  <div class="text-end">
    <button type="button" class="btn btn-secondary btn-sm me-1" (click)="onCancelar()">
      {{ 'cancelButton' | translate }}
    </button>
    <button type="button" class="btn btn-danger btn-sm" (click)="onConfirmar()">
      {{ 'confirmButton' | translate }}
    </button>
  </div>
</dialog>
