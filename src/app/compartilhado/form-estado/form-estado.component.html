<form #f="ngForm" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label for="sigla" class="col-sm-4 col-form-label form-label-eyebrow">Sigla</label>
    <div class="col-sm-12">
      <input
        type="text"
        class="form-control col-sm-2"
        id="sigla"
        name="sigla"
        #sigla="ngModel"
        minlength="2"
        maxlength="2"
        size="2"
        [(ngModel)]="estado().sigla"
        [class.is-invalid]="!sigla.valid && sigla.touched"
        [attr.aria-invalid]="!sigla.valid && sigla.touched ? true : null"
        aria-describedby="sigla-erro"
        required
      />
      @if (!sigla.valid && sigla.touched) {
        <div id="sigla-erro" class="text-danger">Digite a sigla do estado.</div>
      }
    </div>
  </div>
  <div class="mb-3">
    <label for="nome" class="col-sm-4 col-form-label form-label-eyebrow">Nome</label>
    <div class="col-sm-12">
      <input
        type="text"
        class="form-control"
        id="nome"
        name="nome"
        minlength="3"
        maxlength="100"
        placeholder="Digite o nome do estado..."
        #nome="ngModel"
        [(ngModel)]="estado().nome"
        [class.is-invalid]="!nome.valid && nome.touched"
        [attr.aria-invalid]="!nome.valid && nome.touched ? true : null"
        aria-describedby="nome-erro"
        required
      />
      @if (!nome.valid && nome.touched) {
        <div id="nome-erro" class="text-danger">Digite o nome do estado.</div>
      }
    </div>
  </div>
  <div class="col-sm-12">
    <button class="btn btn-primary float-end" type="submit" [disabled]="!f.valid || desabilitado()">
      <app-icon name="check" [size]="14" />
      Salvar
    </button>
  </div>
</form>
