# Reporte contra o mesmo alvo de cobertura do backend (be-java-spring/pom.xml,
# regra JaCoCo BUNDLE/LINE/COVEREDRATIO >= 0.60), mas ainda em modo
# informativo: não bloqueia PRs até a baseline atual ser revisada. Quando
# decidirem travar o gate, basta remover `informational: true` (mesmo ponto de
# decisão do backend ao vincular o goal `check` à fase `verify`).
coverage:
  status:
    project:
      default:
        target: 60%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: 'reach, diff, flags, files'
